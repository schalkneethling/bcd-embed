<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data mode fixture</title>
    <link rel="stylesheet" href="/dist/base.css" />
    <script type="module" src="./data-mode.ts"></script>
  </head>
  <body>
    <!-- The element in data mode: the script assigns the adversarial fixture to its `data`
         property. The page links the built base stylesheet and nothing else, so it shows the
         table as an author who opts into the stylesheet gets it. `unstyled.html` is the same
         page with no stylesheet. -->
    <main>
      <h1>Data mode fixture</h1>
      <bcd-compat-table id="table" browsers="chrome opera nodejs">
        <p>Fallback: the browser compatibility table has not loaded.</p>
      </bcd-compat-table>
    </main>
  </body>
</html>
