# Releases @schalkneethling/bcd-embed, the one package this repository publishes to npm. Every push
# to main runs it, and it does one of two things (the docs site's "Releasing the component" page,
# apps/website/src/content/docs/releasing.md, walks through both):
#
#   1. While `.changeset/` holds changesets that are not released yet, the `version` job opens or
#      updates the "Version Packages" pull request through changesets/action's `version` step.
#   2. Once that pull request is merged, no changesets are pending, and the package's version has
#      no git tag yet, the workflow builds the package, stages it on npm with `npm stage publish`
#      over OpenID Connect (OIDC), and records the git tag and a draft GitHub release. A
#      maintainer then approves the staged version with `npm stage approve` and two-factor
#      authentication (2FA), and publishes the draft release.
#
# Changesets' own publish step is not used, because Changesets does not support staged publishing
# (https://changesets.dev/guide/automating#trusted-publishing): it decides what to publish by asking
# the registry, which does not list a staged version, so it would stage the same version again on
# every push until the maintainer approved it. The git tag is this workflow's record instead.
#
# npm's trusted publisher for the package names this file, `release.yml`, and the `publish`
# environment. Renaming either breaks publishing until the trusted publisher is updated
# (`npx fledgling sync` reads both from the `fledgling` block in the root package.json).
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# One release run at a time, and never cancel one that may be staging.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what to release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      git-tag: ${{ steps.plan.outputs.git_tag }}
      dist-tag: ${{ steps.plan.outputs.dist_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `mode` is `version` while changesets are pending, `stage` when the current version has not
      # been staged yet, and `none` otherwise. In pre-release mode, `changeset version` moves the
      # changesets it used into `.changeset/pre/`, so only top-level files count as pending.
      - name: Read the changesets, the version, and its git tag
        id: plan
        run: |
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')"
          name="$(node -p 'require("./packages/element/package.json").name')"
          version="$(node -p 'require("./packages/element/package.json").version')"
          git_tag="${name}@${version}"

          dist_tag="latest"
          if [ -f .changeset/pre.json ] && [ "$(node -p 'require("./.changeset/pre.json").mode')" = "pre" ]; then
            dist_tag="$(node -p 'require("./.changeset/pre.json").tag')"
          fi
          case "$version" in
            *-*)
              if [ "$dist_tag" = "latest" ]; then
                echo "::error::$version is a prerelease, but Changesets is not in pre-release mode, so it has no dist-tag other than latest."
                exit 1
              fi
              ;;
          esac

          if [ "$pending" != "0" ]; then
            mode="version"
          elif [ "$version" = "0.0.0" ]; then
            mode="none"
          else
            # Exit code 2 means the tag does not exist; anything else non-zero is a failure.
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/${git_tag}" > /dev/null || status=$?
            case "$status" in
              0) mode="none" ;;
              2) mode="stage" ;;
              *) echo "::error::Could not list the remote tags."; exit 1 ;;
            esac
          fi

          echo "Pending changesets: $pending. Version: $version. Git tag: $git_tag. Dist-tag: $dist_tag. Mode: $mode."
          {
            echo "mode=$mode"
            echo "version=$version"
            echo "git_tag=$git_tag"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"

  version:
    name: Open or update the release pull request
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits the version changes to the changeset-release/main branch
      pull-requests: write # opens or updates the "Version Packages" pull request

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Runs `changeset version` and commits the result to the `changeset-release/main` branch
      # through the GitHub API, so the checkout needs no stored credentials.
      - name: Open or update the "Version Packages" pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  build:
    name: Build and pack the package
    needs: plan
    if: needs.plan.outputs.mode == 'stage'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the package
        run: pnpm --filter @schalkneethling/bcd-embed build

      # publint checks package.json against the packed files; Are the Types Wrong (attw) checks
      # that the entry's types resolve for ESM consumers.
      - name: Check the package's manifest and types
        run: pnpm --filter @schalkneethling/bcd-embed check:package

      # `pnpm pack` rewrites the `workspace:` ranges in package.json, which `npm pack` would leave
      # in place.
      - name: Pack the package
        run: pnpm --filter @schalkneethling/bcd-embed pack --out "$RUNNER_TEMP/package/package.tgz"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: ${{ runner.temp }}/package/package.tgz
          if-no-files-found: error
          retention-days: 7

  # The only job with an OIDC token. It checks out nothing and installs nothing but a pinned npm,
  # so no code from the repository or its dependencies runs while the token exists.
  stage:
    name: Stage the release on npm
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read # keeps the workflow default, which a job-level block replaces
      id-token: write # exchanges the OIDC token for a short-lived npm token

    steps:
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0

      # Trusted publishing needs npm 11.5.1 or later and staged publishing 11.15.0 or later
      # (https://docs.npmjs.com/trusted-publishers, https://docs.npmjs.com/staged-publishing).
      # The version is pinned exactly and installs without scripts. No lockfile covers it, which
      # zizmor's `adhoc-packages` audit reports, because this job deliberately checks out nothing.
      - name: Install a pinned npm
        run: npm install --global --ignore-scripts npm@12.2.3 # zizmor: ignore[adhoc-packages]

      # The dist-tag is fixed when a version is staged, and approval publishes it with that tag.
      # npm generates provenance by itself under trusted publishing from a public repository.
      - name: Stage the package
        env:
          DIST_TAG: ${{ needs.plan.outputs.dist-tag }}
        run: npm stage publish ./package/package.tgz --tag "$DIST_TAG" --access public

  release:
    name: Record the git tag and a draft release
    needs: [plan, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the git tag and the draft release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The tag is the record that this version is staged, so the next push to main does not stage
      # it again. The release stays a draft until the maintainer approves the staged version.
      - name: Create the git tag and the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          GIT_TAG: ${{ needs.plan.outputs.git-tag }}
        run: |
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const changelog = readFileSync("packages/element/CHANGELOG.md", "utf8");
            const heading = `## ${process.env.VERSION}\n`;
            const start = changelog.indexOf(heading);
            if (start === -1) throw new Error(`CHANGELOG.md has no section for ${process.env.VERSION}.`);
            const rest = changelog.slice(start + heading.length);
            const end = rest.search(/^## /m);
            writeFileSync("release-notes.md", (end === -1 ? rest : rest.slice(0, end)).trim() + "\n");
          '
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${GIT_TAG}" -f "sha=${GITHUB_SHA}" > /dev/null
          prerelease="false"
          case "$VERSION" in *-*) prerelease="true" ;; esac
          gh release create "$GIT_TAG" --verify-tag --draft --prerelease="$prerelease" \
            --title "$GIT_TAG" --notes-file release-notes.md
