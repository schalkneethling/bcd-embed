name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The parent of the pull request merge commit is needed to list its changed files.
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A pull request that only adds a reviewed freshness approval changes no code, so
      # it needs only the approvals file checked. Anything else, including a diff that
      # cannot be listed, and every push to main, runs the full suite.
      - name: Detect an approvals-only pull request
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if changed="$(git diff --name-only HEAD^1 HEAD)" && [ "$changed" = ".github/freshness-approvals.json" ]; then
            echo "approvals_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the freshness approvals file
        if: steps.scope.outputs.approvals_only == 'true'
        run: |
          pnpm exec oxfmt --check .github/freshness-approvals.json
          node scripts/validate-freshness-approvals.mjs

      - name: Check repository
        if: steps.scope.outputs.approvals_only != 'true'
        run: pnpm check

      - name: Validate generated artifacts at full BCD volume
        if: steps.scope.outputs.approvals_only != 'true'
        run: node --expose-gc packages/generator/scripts/full-volume-check.mjs

      - name: Check core mutation gate
        if: steps.scope.outputs.approvals_only != 'true'
        run: pnpm --filter @bcd-embed/core test:mutation
