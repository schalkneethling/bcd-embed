version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/docs"
      - "/apps/worker"
      - "/packages/core"
      - "/packages/generator"
      - "/packages/schema"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      include:
        - "*"
    groups:
      bcd-pins:
        patterns:
          - "@mdn/browser-compat-data"
        group-by: "dependency-name"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
