version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      include:
        - "*"
    ignore:
      # Guidepup 0.40.0 nests Orca keyboard commands under their service, but
      # @guidepup/playwright 0.21.0 still reads them flat and throws in
      # navigateOrcaToWebContent. Remove once a compatible playwright ships.
      - dependency-name: "@guidepup/guidepup"
        versions: [">=0.40.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
