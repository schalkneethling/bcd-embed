packages:
  - "apps/*"
  - "packages/*"

# Keep installs identical between local development and CI. pnpm otherwise
# changes this experimental default in CI, making the workspace appear stale.
enableGlobalVirtualStore: false

engineStrict: true
strictPeerDependencies: true
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  # Security update: replaces the SDK closure containing fast-xml-parser CVEs.
  - "@aws-sdk/client-s3@3.1145.0"
